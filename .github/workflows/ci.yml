name: MVP verification
on:
  push:
    branches: [main]
  pull_request:
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: mvp
          POSTGRES_PASSWORD: mvp-test-password
          POSTGRES_DB: mvp
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mvp -d mvp"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      APP_TEST_POSTGRES_URL: postgresql+psycopg://mvp:mvp-test-password@127.0.0.1:5432/mvp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: python -m venv .venv
      - run: .venv/bin/pip install -e '.[test]'
      - run: .venv/bin/python -m pytest -q
      - run: npm --prefix frontend ci
      - run: npm --prefix frontend run build
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npm --prefix frontend run test:e2e
      - run: PLAYWRIGHT_PRODUCTION=1 npm --prefix frontend run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-failures
          path: frontend/test-results
      - run: docker build -t mujian-ci .
      - name: Migration and same-origin smoke test
        run: |
          docker run -d --name mujian-ci -p 8018:8000 -e APP_DATABASE_URL=sqlite:////tmp/smoke.db -e APP_AUTO_CREATE_SCHEMA=false mujian-ci
          trap 'docker logs mujian-ci; docker rm -f mujian-ci' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8018/healthz; then break; fi
            sleep 1
          done
          curl --fail http://127.0.0.1:8018/healthz
          curl --fail http://127.0.0.1:8018/ | grep '幕间'
